baseURL = 'https://bathtub-01.github.io/'
languageCode = 'en-us'
enableRobotsTXT = true
title = 'Yukang Xie'

[menus]
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30

  [[menus.main]]
    name = 'Technical Blog'
    pageRef = '/technical'
    weight = 10

  [[menus.main]]
    name = 'General Posts'
    pageRef = '/posts'
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false
    style = 'github'

  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true

        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[params]
  description = 'Personal website of Yukang Xie.'

[caches]
  [caches.images]
    dir = ':cacheDir/images'